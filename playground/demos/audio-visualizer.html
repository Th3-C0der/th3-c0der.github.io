<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Visualizer - Th3-C0der Playground</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5166575587547718" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            color: white;
            text-align: center;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            min-width: 300px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .controls.minimized {
            transform: translateX(-50%) translateY(calc(100% - 40px));
            opacity: 0.7;
        }

        .controls-toggle {
            position: absolute;
            top: -40px;
            /* left: 50%;
            transform: translateX(-50%); */
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            border-radius: 8px 8px 0 0;
            width: 60px;
            height: 40px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .controls-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .controls-toggle::before {
            content: '▼';
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        .controls-toggle.minimized::before {
            transform: rotate(180deg);
        }

        .progress-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            z-index: 2;
            transition: transform 0.3s ease;
        }

        .progress-container.minimized {
            transform: translateY(100%);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .controls button, .controls select {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 15px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            width: 100%;
            text-align: center;
            font-weight: 500;
        }

        .controls button:hover, .controls select:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .controls button:active, .controls select:active {
            transform: translateY(1px);
        }

        .controls input[type="range"] {
            width: 100%;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            height: 6px;
            -webkit-appearance: none;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .instructions {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            font-size: 14px;
            max-width: 250px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .instructions h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .instructions p {
            margin: 5px 0;
            line-height: 1.4;
        }

        .file-input {
            display: none;
        }

        .file-label {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-block;
            transition: all 0.3s;
            margin: 10px 0;
            text-align: center;
            font-weight: 500;
        }

        .file-label:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .visualizer-type {
            margin: 10px 0;
        }

        .visualizer-type select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: 500;
        }

        .visualizer-type select:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin: 10px 0;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: #4CAF50;
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-display {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: 1fr;
                width: 90%;
                max-width: 400px;
                padding: 15px;
                gap: 10px;
            }

            .controls-toggle {
                display: flex;
            }

            .control-group {
                padding: 10px;
                gap: 8px;
            }

            .controls button, .controls select {
                padding: 8px 12px;
                font-size: 13px;
            }

            .controls input[type="range"] {
                margin: 3px 0;
            }

            .instructions {
                display: none;
            }

            .back-btn {
                padding: 8px 15px;
                font-size: 14px;
            }

            .progress-container {
                padding: 8px 15px;
            }

            .progress-bar {
                height: 3px;
            }

            .time-display {
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            .controls {
                padding: 10px;
            }

            .control-group {
                padding: 8px;
            }

            .controls button, .controls select {
                padding: 6px 10px;
                font-size: 12px;
            }

            .file-label {
                padding: 8px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <canvas id="visualizer"></canvas>
    <a href="/playground" class="back-btn">← Back to Playground</a>
    <div class="instructions">
        <h3>Controls:</h3>
        <p>• Space: Play/Pause</p>
        <p>• R: Reset</p>
        <p>• ←/→: Seek</p>
        <p>• ↑/↓: Volume</p>
    </div>
    <div class="controls" id="controls">
        <button class="controls-toggle" id="controlsToggle"></button>
        <div class="control-group">
            <input type="file" id="audio-file" class="file-input" accept="audio/*">
            <label for="audio-file" class="file-label">Choose Audio File</label>
            <div class="visualizer-type">
                <select id="visualizer-type">
                    <option value="bars">Bars</option>
                    <option value="circle">Circle</option>
                    <option value="wave">Wave</option>
                    <option value="spectrum">Spectrum</option>
                    <option value="3d">3D Bars</option>
                </select>
            </div>
        </div>
        <div class="control-group">
            <label>Volume: <span id="volumeValue">100</span>%</label>
            <input type="range" id="volume" min="0" max="100" value="100">
            <label>Bass Boost: <span id="bassValue">0</span>dB</label>
            <input type="range" id="bass" min="0" max="12" value="0">
        </div>
        <div class="control-group">
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
            <div class="time-display">
                <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
            </div>
            <button id="play-pause">Play/Pause</button>
            <button id="reset">Reset</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const audioFile = document.getElementById('audio-file');
        const playPauseBtn = document.getElementById('play-pause');
        const resetBtn = document.getElementById('reset');
        const visualizerType = document.getElementById('visualizer-type');
        const progressBar = document.getElementById('progress');
        const currentTimeDisplay = document.getElementById('currentTime');
        const durationDisplay = document.getElementById('duration');

        let audioContext;
        let analyser;
        let dataArray;
        let source;
        let audioBuffer;
        let isPlaying = false;
        let startTime = 0;
        let pausedTime = 0;
        let gainNode;
        let bassBoost;
        let volume = 1;
        let bassGain = 0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function initAudio() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;
            const bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);

            gainNode = audioContext.createGain();
            gainNode.gain.value = volume;

            // Create bass boost filter
            bassBoost = audioContext.createBiquadFilter();
            bassBoost.type = 'lowshelf';
            bassBoost.frequency.value = 100;
            bassBoost.gain.value = bassGain;
        }

        function loadAudio(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                audioContext.decodeAudioData(e.target.result, function(buffer) {
                    audioBuffer = buffer;
                    durationDisplay.textContent = formatTime(buffer.duration);
                    playAudio();
                });
            };
            reader.readAsArrayBuffer(file);
        }

        function playAudio() {
            if (source) {
                source.stop();
            }
            source = audioContext.createBufferSource();
            source.buffer = audioBuffer;
            
            // Connect nodes
            source.connect(analyser);
            analyser.connect(bassBoost);
            bassBoost.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            if (pausedTime) {
                source.start(0, pausedTime);
                startTime = audioContext.currentTime - pausedTime;
            } else {
                source.start(0);
                startTime = audioContext.currentTime;
            }
            
            isPlaying = true;
            draw();
        }

        function togglePlayPause() {
            if (!audioBuffer) return;

            if (isPlaying) {
                source.stop();
                pausedTime = audioContext.currentTime - startTime;
                isPlaying = false;
            } else {
                playAudio();
            }
        }

        function reset() {
            if (source) {
                source.stop();
            }
            pausedTime = 0;
            isPlaying = false;
            progressBar.style.width = '0%';
            currentTimeDisplay.textContent = '0:00';
            draw();
        }

        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            seconds = Math.floor(seconds % 60);
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function updateProgress() {
            if (!isPlaying) return;
            
            const currentTime = audioContext.currentTime - startTime;
            const progress = (currentTime / audioBuffer.duration) * 100;
            progressBar.style.width = `${progress}%`;
            currentTimeDisplay.textContent = formatTime(currentTime);
            
            requestAnimationFrame(updateProgress);
        }

        function draw() {
            if (!isPlaying) return;

            requestAnimationFrame(draw);
            analyser.getByteFrequencyData(dataArray);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const type = visualizerType.value;
            switch(type) {
                case 'bars':
                    drawBars();
                    break;
                case 'circle':
                    drawCircle();
                    break;
                case 'wave':
                    drawWave();
                    break;
                case 'spectrum':
                    drawSpectrum();
                    break;
                case '3d':
                    draw3DBars();
                    break;
            }
        }

        function drawBars() {
            const barWidth = canvas.width / dataArray.length;
            let x = 0;

            for (let i = 0; i < dataArray.length; i++) {
                const barHeight = (dataArray[i] / 255) * canvas.height;
                
                const gradient = ctx.createLinearGradient(0, canvas.height, 0, 0);
                gradient.addColorStop(0, '#00ff00');
                gradient.addColorStop(0.5, '#ffff00');
                gradient.addColorStop(1, '#ff0000');
                
                ctx.fillStyle = gradient;
                ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                
                x += barWidth;
            }
        }

        function drawCircle() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(centerX, centerY) * 0.8;

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.stroke();

            for (let i = 0; i < dataArray.length; i++) {
                const angle = (i * 2 * Math.PI) / dataArray.length;
                const amplitude = (dataArray[i] / 255) * radius * 0.5;
                
                const x1 = centerX + Math.cos(angle) * radius;
                const y1 = centerY + Math.sin(angle) * radius;
                const x2 = centerX + Math.cos(angle) * (radius + amplitude);
                const y2 = centerY + Math.sin(angle) * (radius + amplitude);

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = `hsl(${i * 360 / dataArray.length}, 100%, 50%)`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function drawWave() {
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);

            for (let i = 0; i < dataArray.length; i++) {
                const x = (i / dataArray.length) * canvas.width;
                const y = (dataArray[i] / 255) * canvas.height;
                
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }

            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawSpectrum() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(centerX, centerY) * 0.8;

            for (let i = 0; i < dataArray.length; i++) {
                const angle = (i * 2 * Math.PI) / dataArray.length;
                const amplitude = (dataArray[i] / 255) * radius;
                
                const x = centerX + Math.cos(angle) * amplitude;
                const y = centerY + Math.sin(angle) * amplitude;

                ctx.beginPath();
                ctx.arc(x, y, 2, 0, 2 * Math.PI);
                ctx.fillStyle = `hsl(${i * 360 / dataArray.length}, 100%, 50%)`;
                ctx.fill();
            }
        }

        function draw3DBars() {
            const barWidth = canvas.width / dataArray.length;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const maxHeight = canvas.height * 0.4;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(-Math.PI / 4);

            for (let i = 0; i < dataArray.length; i++) {
                const height = (dataArray[i] / 255) * maxHeight;
                const x = (i - dataArray.length / 2) * barWidth;
                
                // Draw 3D effect
                ctx.fillStyle = 'rgba(0, 255, 0, 0.5)';
                ctx.fillRect(x, -height/2, barWidth, height);
                
                // Draw top face
                ctx.fillStyle = 'rgba(0, 255, 0, 0.8)';
                ctx.beginPath();
                ctx.moveTo(x, -height/2);
                ctx.lineTo(x + barWidth, -height/2);
                ctx.lineTo(x + barWidth, -height/2 - 10);
                ctx.lineTo(x, -height/2 - 10);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();
        }

        // Event Listeners
        audioFile.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                loadAudio(e.target.files[0]);
            }
        });

        playPauseBtn.addEventListener('click', togglePlayPause);
        resetBtn.addEventListener('click', reset);
        visualizerType.addEventListener('change', () => {
            if (isPlaying) {
                draw();
            }
        });

        document.getElementById('volume').addEventListener('input', (e) => {
            volume = e.target.value / 100;
            gainNode.gain.value = volume;
            document.getElementById('volumeValue').textContent = e.target.value;
        });

        document.getElementById('bass').addEventListener('input', (e) => {
            bassGain = parseInt(e.target.value);
            bassBoost.gain.value = bassGain;
            document.getElementById('bassValue').textContent = e.target.value;
        });

        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'Space':
                    togglePlayPause();
                    break;
                case 'KeyR':
                    reset();
                    break;
                case 'ArrowLeft':
                    if (source) {
                        pausedTime = Math.max(0, pausedTime - 5);
                        playAudio();
                    }
                    break;
                case 'ArrowRight':
                    if (source) {
                        pausedTime = Math.min(audioBuffer.duration, pausedTime + 5);
                        playAudio();
                    }
                    break;
                case 'ArrowUp':
                    volume = Math.min(1, volume + 0.1);
                    gainNode.gain.value = volume;
                    document.getElementById('volume').value = volume * 100;
                    document.getElementById('volumeValue').textContent = Math.round(volume * 100);
                    break;
                case 'ArrowDown':
                    volume = Math.max(0, volume - 0.1);
                    gainNode.gain.value = volume;
                    document.getElementById('volume').value = volume * 100;
                    document.getElementById('volumeValue').textContent = Math.round(volume * 100);
                    break;
            }
        });

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        initAudio();

        // Add controls toggle functionality
        function setupControlsToggle() {
            const toggle = document.getElementById('controlsToggle');
            const controls = document.getElementById('controls');
            const progressContainer = document.getElementById('progressContainer');
            
            toggle.addEventListener('click', () => {
                controls.classList.toggle('minimized');
                toggle.classList.toggle('minimized');
                progressContainer.classList.toggle('minimized');
            });

            // Auto-minimize controls after 3 seconds of inactivity
            let timeout;
            const resetTimeout = () => {
                clearTimeout(timeout);
                if (window.innerWidth <= 768) {
                    timeout = setTimeout(() => {
                        controls.classList.add('minimized');
                        toggle.classList.add('minimized');
                        progressContainer.classList.add('minimized');
                    }, 3000);
                }
            };

            // Reset timeout on user interaction
            controls.addEventListener('mouseenter', resetTimeout);
            controls.addEventListener('touchstart', resetTimeout);
            progressContainer.addEventListener('mouseenter', resetTimeout);
            progressContainer.addEventListener('touchstart', resetTimeout);
            
            // Initial timeout
            resetTimeout();
        }

        // Call setupControlsToggle after DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            setupControlsToggle();
        });
    </script>
</body>
</html>
