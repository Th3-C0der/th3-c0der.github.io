<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Neon Fluid - Th3-C0der Playground</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #fff;
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-weight: 500;
            pointer-events: auto;
            transition: color 0.3s;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
        }

        .back-btn:hover {
            color: #fff;
        }

        .controls {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 200px;
        }

        .control-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        label {
            font-size: 0.9rem;
            color: #ccc;
        }

        button {
            background: #333;
            border: 1px solid #555;
            color: #fff;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            background: #444;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            background: #00ffcc;
            border-radius: 50%;
            cursor: pointer;
        }

        .hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <canvas id="fluidCanvas"></canvas>

    <div class="ui-overlay">
        <a href="/playground" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back to Playground
        </a>
    </div>

    <div class="hint">Click and drag to stir the fluid</div>

    <div class="controls">
        <div class="control-group">
            <label>Color</label>
            <input type="color" id="colorPicker" value="#00ffcc">
        </div>
        <div class="control-group">
            <label>Viscosity</label>
            <input type="range" id="viscosity" min="0" max="0.02" step="0.001" value="0.000">
        </div>
        <div class="control-group">
            <label>Density</label>
            <input type="range" id="density" min="10" max="100" value="50">
        </div>
        <button id="randomizeBtn">Randomize Colors</button>
        <button id="clearBtn">Clear Fluid</button>
    </div>

    <script>
        // Basic Stable Fluid Solver (based on Jos Stam)
        const canvas = document.getElementById('fluidCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        const N = 64; // Grid size
        const iter = 10;
        const scale = 8; // Rendering scale

        // Fluid arrays
        let u, v, u_prev, v_prev, dens, dens_prev;

        // Parameters
        let dt = 0.1;
        let diff = 0.000;
        let visc = 0.000;
        let force = 50.0;
        let source = 100.0;
        let drawColor = [0, 255, 204];
        let isRandomColor = false;

        function initArrays() {
            const size = (N + 2) * (N + 2);
            u = new Float32Array(size);
            v = new Float32Array(size);
            u_prev = new Float32Array(size);
            v_prev = new Float32Array(size);
            dens = new Float32Array(size);
            dens_prev = new Float32Array(size);
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            width = canvas.width;
            height = canvas.height;
            // Re-init not strictly necessary for grid logic as N is fixed, 
            // but we scale drawing to window
        }

        function IX(x, y) {
            return x + (N + 2) * y;
        }

        function add_source(x, s, dt) {
            const size = (N + 2) * (N + 2);
            for (let i = 0; i < size; i++) x[i] += dt * s[i];
        }

        function set_bnd(b, x) {
            for (let i = 1; i <= N; i++) {
                x[IX(0, i)] = b == 1 ? -x[IX(1, i)] : x[IX(1, i)];
                x[IX(N + 1, i)] = b == 1 ? -x[IX(N, i)] : x[IX(N, i)];
                x[IX(i, 0)] = b == 2 ? -x[IX(i, 1)] : x[IX(i, 1)];
                x[IX(i, N + 1)] = b == 2 ? -x[IX(i, N)] : x[IX(i, N)];
            }
            x[IX(0, 0)] = 0.5 * (x[IX(1, 0)] + x[IX(0, 1)]);
            x[IX(0, N + 1)] = 0.5 * (x[IX(1, N + 1)] + x[IX(0, N)]);
            x[IX(N + 1, 0)] = 0.5 * (x[IX(N, 0)] + x[IX(N + 1, 1)]);
            x[IX(N + 1, N + 1)] = 0.5 * (x[IX(N, N + 1)] + x[IX(N + 1, N)]);
        }

        function lin_solve(b, x, x0, a, c) {
            const cRecip = 1.0 / c;
            for (let k = 0; k < iter; k++) {
                for (let j = 1; j <= N; j++) {
                    for (let i = 1; i <= N; i++) {
                        x[IX(i, j)] = (x0[IX(i, j)] + a * (x[IX(i - 1, j)] + x[IX(i + 1, j)] + x[IX(i, j - 1)] + x[IX(i, j + 1)])) * cRecip;
                    }
                }
                set_bnd(b, x);
            }
        }

        function diffuse(b, x, x0, diff, dt) {
            const a = dt * diff * (N * N);
            lin_solve(b, x, x0, a, 1 + 4 * a);
        }

        function advect(b, d, d0, u, v, dt) {
            let i0, j0, i1, j1;
            let x, y, s0, t0, s1, t1, dt0;

            dt0 = dt * N;
            for (let j = 1; j <= N; j++) {
                for (let i = 1; i <= N; i++) {
                    x = i - dt0 * u[IX(i, j)];
                    y = j - dt0 * v[IX(i, j)];

                    if (x < 0.5) x = 0.5; if (x > N + 0.5) x = N + 0.5; i0 = Math.floor(x); i1 = i0 + 1;
                    if (y < 0.5) y = 0.5; if (y > N + 0.5) y = N + 0.5; j0 = Math.floor(y); j1 = j0 + 1;

                    s1 = x - i0; s0 = 1 - s1;
                    t1 = y - j0; t0 = 1 - t1;

                    d[IX(i, j)] = s0 * (t0 * d0[IX(i0, j0)] + t1 * d0[IX(i0, j1)]) +
                        s1 * (t0 * d0[IX(i1, j0)] + t1 * d0[IX(i1, j1)]);
                }
            }
            set_bnd(b, d);
        }

        function project(u, v, p, div) {
            for (let j = 1; j <= N; j++) {
                for (let i = 1; i <= N; i++) {
                    div[IX(i, j)] = -0.5 * (u[IX(i + 1, j)] - u[IX(i - 1, j)] + v[IX(i, j + 1)] - v[IX(i, j - 1)]) / N;
                    p[IX(i, j)] = 0;
                }
            }
            set_bnd(0, div); set_bnd(0, p);

            lin_solve(0, p, div, 1, 4);

            for (let j = 1; j <= N; j++) {
                for (let i = 1; i <= N; i++) {
                    u[IX(i, j)] -= 0.5 * N * (p[IX(i + 1, j)] - p[IX(i - 1, j)]);
                    v[IX(i, j)] -= 0.5 * N * (p[IX(i, j + 1)] - p[IX(i, j - 1)]);
                }
            }
            set_bnd(1, u); set_bnd(2, v);
        }

        function dens_step(x, x0, u, v, diff, dt) {
            add_source(x, x0, dt);
            diffuse(0, x0, x, diff, dt);
            advect(0, x, x0, u, v, dt);
        }

        function vel_step(u, v, u0, v0, visc, dt) {
            add_source(u, u0, dt);
            add_source(v, v0, dt);

            diffuse(1, u0, u, visc, dt);
            diffuse(2, v0, v, visc, dt);

            project(u0, v0, u, v);

            advect(1, u, u0, u0, v0, dt);
            advect(2, v, v0, u0, v0, dt);

            project(u, v, u0, v0);
        }

        // --- Interaction ---
        let isDragging = false;
        let prevX, prevY;

        canvas.addEventListener('mousedown', e => {
            isDragging = true;
            prevX = e.clientX;
            prevY = e.clientY;
        });

        window.addEventListener('mouseup', () => isDragging = false);

        canvas.addEventListener('mousemove', e => {
            if (!isDragging) return;

            const x = e.clientX;
            const y = e.clientY;

            // Map screen to grid
            // Grid is NxN. 
            // NormalizedPos (0-1) * N
            const gridX = Math.floor((x / width) * N) + 1;
            const gridY = Math.floor((y / height) * N) + 1;

            // Add density
            if (gridX > 0 && gridX <= N && gridY > 0 && gridY <= N) {
                dens_prev[IX(gridX, gridY)] = source;

                // Add velocity based on mouse delta
                const dx = x - prevX;
                const dy = y - prevY;

                u_prev[IX(gridX, gridY)] = dx * force;
                v_prev[IX(gridX, gridY)] = dy * force;

                if (isRandomColor) {
                    drawColor = [Math.random() * 255, Math.random() * 255, Math.random() * 255];
                    const picker = document.getElementById('colorPicker');
                    // keep picker synced? Nah, random mode
                }
            }

            prevX = x;
            prevY = y;
        });

        // Touch support
        canvas.addEventListener('touchstart', e => {
            isDragging = true;
            prevX = e.touches[0].clientX;
            prevY = e.touches[0].clientY;
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('touchmove', e => {
            if (!isDragging) return;
            const x = e.touches[0].clientX;
            const y = e.touches[0].clientY;

            const gridX = Math.floor((x / width) * N) + 1;
            const gridY = Math.floor((y / height) * N) + 1;

            if (gridX > 0 && gridX <= N && gridY > 0 && gridY <= N) {
                dens_prev[IX(gridX, gridY)] = source;

                const dx = x - prevX;
                const dy = y - prevY;

                u_prev[IX(gridX, gridY)] = dx * force;
                v_prev[IX(gridX, gridY)] = dy * force;
            }
            prevX = x;
            prevY = y;
            e.preventDefault();
        }, { passive: false });

        // --- Rendering ---
        function draw() {
            // Draw grid density stretched to canvas
            // Optimization: Draw to small offscreen/image data then scale? 
            // Or draw rects. For N=64, rects are fine.

            ctx.clearRect(0, 0, width, height);

            const cellW = Math.ceil(width / N);
            const cellH = Math.ceil(height / N);

            for (let j = 1; j <= N; j++) {
                for (let i = 1; i <= N; i++) {
                    const d = dens[IX(i, j)];
                    if (d > 0.01) {
                        const alpha = Math.min(d, 1);
                        // Using user color
                        if (!isRandomColor) {
                            ctx.fillStyle = `rgba(${drawColor[0]}, ${drawColor[1]}, ${drawColor[2]}, ${alpha})`;
                        } else {
                            // Simple hack for multi-color:
                            // We aren't tracking color per cell in this SIMPLE implementation.
                            // So we just use global color. 
                            // To stick to constraints of simple 1-file demo, we use the global set color.
                            ctx.fillStyle = `rgba(${drawColor[0]}, ${drawColor[1]}, ${drawColor[2]}, ${alpha})`;
                        }

                        // To make it look smoother and neon-like
                        // Draw slightly larger rects to overlap
                        ctx.fillRect((i - 1) * width / N, (j - 1) * height / N, width / N + 1, height / N + 1);
                    }
                }
            }
        }

        function loop() {
            vel_step(u, v, u_prev, v_prev, visc, dt);
            dens_step(dens, dens_prev, u, v, diff, dt);

            draw();

            // Reset inputs
            const size = (N + 2) * (N + 2);
            for (let i = 0; i < size; i++) {
                u_prev[i] = 0;
                v_prev[i] = 0;
                dens_prev[i] = 0;
            }

            requestAnimationFrame(loop);
        }

        // Init
        initArrays();
        resize();
        window.addEventListener('resize', resize);

        // UI Bindings
        document.getElementById('colorPicker').addEventListener('input', e => {
            isRandomColor = false;
            const hex = e.target.value;
            const r = parseInt(hex.substr(1, 2), 16);
            const g = parseInt(hex.substr(3, 2), 16);
            const b = parseInt(hex.substr(5, 2), 16);
            drawColor = [r, g, b];
        });

        document.getElementById('viscosity').addEventListener('input', e => {
            visc = parseFloat(e.target.value);
        });

        document.getElementById('density').addEventListener('input', e => {
            source = parseFloat(e.target.value);
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            initArrays(); // Wipes everything
        });

        document.getElementById('randomizeBtn').addEventListener('click', () => {
            // Randomly seed the grid
            for (let i = 0; i < 20; i++) {
                const x = Math.floor(Math.random() * N) + 1;
                const y = Math.floor(Math.random() * N) + 1;
                dens[IX(x, y)] = 100;
                u[IX(x, y)] = (Math.random() - 0.5) * 100;
                v[IX(x, y)] = (Math.random() - 0.5) * 100;
            }
        });

        // Start
        loop();

    </script>
</body>

</html>
