<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Particle Physics Sandbox - Th3-C0der Playground</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5166575587547718" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .canvas-container {
            position: relative;
            flex: 1;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            max-height: 80vh;
            overflow-y: auto;
        }

        .control-group {
            margin-bottom: 1rem;
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .control-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .control-group input[type="range"] {
            width: 100%;
            margin: 0.5rem 0;
        }

        .control-group input[type="color"] {
            width: 100%;
            height: 30px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .control-group select {
            width: 100%;
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: white;
            margin-bottom: 0.5rem;
        }

        .buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        button {
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 80px;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .stats {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        .stats p {
            margin: 0.5rem 0;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            pointer-events: none;
            z-index: 1000;
        }

        .preset-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .preset-btn {
            font-size: 0.8rem;
            padding: 0.3rem 0.5rem;
        }
    </style>
</head>
<body>
    <a href="/playground" class="back-btn">← Back to Playground</a>
    <div class="container">
        <div class="canvas-container">
            <canvas id="physicsCanvas"></canvas>
        </div>
        <div class="controls">
            <div class="control-group">
                <label>Particle Properties</label>
                <input type="range" id="particleSize" min="2" max="20" value="5">
                <label>Size</label>
                <input type="range" id="particleMass" min="1" max="100" value="10">
                <label>Mass</label>
                <input type="range" id="particleElasticity" min="0" max="1" step="0.1" value="0.8">
                <label>Elasticity</label>
                <input type="range" id="particleFriction" min="0" max="1" step="0.1" value="0.1">
                <label>Friction</label>
                <input type="color" id="particleColor" value="#ffffff">
                <label>Color</label>
                <select id="particleShape">
                    <option value="circle">Circle</option>
                    <option value="square">Square</option>
                    <option value="triangle">Triangle</option>
                </select>
                <label>Shape</label>
            </div>
            <div class="control-group">
                <label>Forces</label>
                <input type="range" id="gravity" min="-200" max="200" value="10">
                <label>Gravity</label>
                <input type="range" id="attraction" min="-100" max="100" value="0">
                <label>Attraction</label>
                <input type="range" id="repulsion" min="-100" max="100" value="0">
                <label>Repulsion</label>
                <input type="range" id="wind" min="-50" max="50" value="0">
                <label>Wind</label>
                <input type="range" id="turbulence" min="0" max="100" value="0">
                <label>Turbulence</label>
            </div>
            <div class="control-group">
                <label>Environment</label>
                <input type="range" id="airResistance" min="0" max="1" step="0.01" value="0.01">
                <label>Air Resistance</label>
                <input type="range" id="boundaryElasticity" min="0" max="1" step="0.1" value="0.8">
                <label>Boundary Elasticity</label>
                <select id="boundaryType">
                    <option value="bounce">Bounce</option>
                    <option value="wrap">Wrap</option>
                    <option value="stop">Stop</option>
                </select>
                <label>Boundary Type</label>
            </div>
            <div class="preset-buttons">
                <button class="preset-btn" data-preset="solar">Solar System</button>
                <button class="preset-btn" data-preset="explosion">Explosion</button>
                <button class="preset-btn" data-preset="fountain">Fountain</button>
                <button class="preset-btn" data-preset="vortex">Vortex</button>
                <button class="preset-btn" data-preset="gas">Gas Chamber</button>
                <button class="preset-btn" data-preset="pendulum">Pendulum</button>
            </div>
            <div class="buttons">
                <button id="clearBtn">Clear</button>
                <button id="saveBtn">Save</button>
                <button id="loadBtn">Load</button>
                <button id="pauseBtn">Pause</button>
            </div>
        </div>
        <div class="stats">
            <p>Particles: <span id="particleCount">0</span></p>
            <p>FPS: <span id="fps">0</span></p>
            <p>Energy: <span id="energy">0</span></p>
        </div>
    </div>

    <script>
        class Particle {
            constructor(x, y, size, mass, elasticity, friction, color, shape = 'circle') {
                this.x = x;
                this.y = y;
                this.size = size;
                this.mass = mass;
                this.elasticity = elasticity;
                this.friction = friction;
                this.color = color;
                this.shape = shape;
                this.vx = 0;
                this.vy = 0;
                this.fx = 0;
                this.fy = 0;
                this.rotation = 0;
                this.angularVelocity = 0;
                this.torque = 0;
                this.momentOfInertia = this.calculateMomentOfInertia();
            }

            calculateMomentOfInertia() {
                switch(this.shape) {
                    case 'circle':
                        return 0.5 * this.mass * this.size * this.size;
                    case 'square':
                        return (1/6) * this.mass * (this.size * 2) * (this.size * 2);
                    case 'triangle':
                        return (1/12) * this.mass * (this.size * 2) * (this.size * 2);
                    default:
                        return 0.5 * this.mass * this.size * this.size;
                }
            }

            applyForce(fx, fy, pointX = this.x, pointY = this.y) {
                this.fx += fx;
                this.fy += fy;
                
                // Calculate torque
                const dx = pointX - this.x;
                const dy = pointY - this.y;
                this.torque += dx * fy - dy * fx;
            }

            update(dt) {
                // Update angular velocity
                this.angularVelocity += (this.torque / this.momentOfInertia) * dt;
                this.rotation += this.angularVelocity * dt;
                this.torque = 0;

                // Update velocity
                this.vx += (this.fx / this.mass) * dt;
                this.vy += (this.fy / this.mass) * dt;

                // Update position
                this.x += this.vx * dt;
                this.y += this.vy * dt;

                // Reset forces
                this.fx = 0;
                this.fy = 0;

                // Apply damping
                this.vx *= (1 - this.friction);
                this.vy *= (1 - this.friction);
                this.angularVelocity *= (1 - this.friction);
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.fillStyle = this.color;

                switch(this.shape) {
                    case 'circle':
                        ctx.beginPath();
                        ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    case 'square':
                        ctx.fillRect(-this.size, -this.size, this.size * 2, this.size * 2);
                        break;
                    case 'triangle':
                        ctx.beginPath();
                        ctx.moveTo(0, -this.size);
                        ctx.lineTo(this.size, this.size);
                        ctx.lineTo(-this.size, this.size);
                        ctx.closePath();
                        ctx.fill();
                        break;
                }

                ctx.restore();
            }

            getEnergy() {
                const kinetic = 0.5 * this.mass * (this.vx * this.vx + this.vy * this.vy);
                const rotational = 0.5 * this.momentOfInertia * this.angularVelocity * this.angularVelocity;
                return kinetic + rotational;
            }
        }

        class PhysicsSimulation {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.lastTime = 0;
                this.fps = 0;
                this.frameCount = 0;
                this.lastFpsUpdate = 0;
                this.paused = false;
                this.grid = new SpatialHashGrid(50); // 50px cell size

                this.setupCanvas();
                this.setupEventListeners();
                this.animate();
            }

            setupCanvas() {
                const resizeCanvas = () => {
                    this.canvas.width = window.innerWidth;
                    this.canvas.height = window.innerHeight;
                };
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
            }

            setupEventListeners() {
                this.canvas.addEventListener('click', (e) => this.addParticle(e));
                this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));

                document.getElementById('clearBtn').addEventListener('click', () => this.clear());
                document.getElementById('saveBtn').addEventListener('click', () => this.save());
                document.getElementById('loadBtn').addEventListener('click', () => this.load());
                document.getElementById('pauseBtn').addEventListener('click', () => this.togglePause());

                // Preset buttons
                document.querySelectorAll('.preset-btn').forEach(btn => {
                    btn.addEventListener('click', () => this.loadPreset(btn.dataset.preset));
                });
            }

            addParticle(e) {
                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const size = parseInt(document.getElementById('particleSize').value);
                const mass = parseInt(document.getElementById('particleMass').value);
                const elasticity = parseFloat(document.getElementById('particleElasticity').value);
                const friction = parseFloat(document.getElementById('particleFriction').value);
                const color = document.getElementById('particleColor').value;
                const shape = document.getElementById('particleShape').value;

                this.particles.push(new Particle(x, y, size, mass, elasticity, friction, color, shape));
            }

            handleMouseMove(e) {
                if (e.buttons === 1) { // Left mouse button
                    this.addParticle(e);
                }
            }

            update(dt) {
                if (this.paused) return;

                const gravity = parseInt(document.getElementById('gravity').value);
                const attraction = parseInt(document.getElementById('attraction').value);
                const repulsion = parseInt(document.getElementById('repulsion').value);
                const wind = parseInt(document.getElementById('wind').value);
                const turbulence = parseInt(document.getElementById('turbulence').value);
                const airResistance = parseFloat(document.getElementById('airResistance').value);
                const boundaryType = document.getElementById('boundaryType').value;
                const boundaryElasticity = parseFloat(document.getElementById('boundaryElasticity').value);

                // Update spatial grid
                this.grid.clear();
                this.particles.forEach(particle => {
                    this.grid.insert(particle);
                });

                // Apply forces
                for (let i = 0; i < this.particles.length; i++) {
                    const p1 = this.particles[i];

                    // Apply gravity
                    p1.applyForce(0, gravity);

                    // Apply wind
                    p1.applyForce(wind, 0);

                    // Apply turbulence
                    if (turbulence > 0) {
                        const tx = (Math.random() - 0.5) * turbulence;
                        const ty = (Math.random() - 0.5) * turbulence;
                        p1.applyForce(tx, ty);
                    }

                    // Apply air resistance
                    p1.applyForce(-p1.vx * airResistance, -p1.vy * airResistance);

                    // Get nearby particles from spatial grid
                    const nearby = this.grid.query(p1);
                    
                    // Apply particle interactions
                    for (const p2 of nearby) {
                        if (p1 === p2) continue;

                        const dx = p2.x - p1.x;
                        const dy = p2.y - p1.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        const minDist = p1.size + p2.size;

                        if (distance < minDist) {
                            // Collision response with rotation
                            const angle = Math.atan2(dy, dx);
                            const overlap = minDist - distance;
                            const moveX = Math.cos(angle) * overlap * 0.5;
                            const moveY = Math.sin(angle) * overlap * 0.5;

                            p1.x -= moveX;
                            p1.y -= moveY;
                            p2.x += moveX;
                            p2.y += moveY;

                            // Calculate relative velocity
                            const vx = p1.vx - p2.vx;
                            const vy = p1.vy - p2.vy;
                            const dot = vx * dx + vy * dy;
                            const impulse = (2 * dot) / (distance * distance);

                            // Apply impulse with rotation
                            const impulseX = impulse * dx;
                            const impulseY = impulse * dy;

                            p1.applyForce(-impulseX * p2.mass / (p1.mass + p2.mass) * p1.elasticity, 
                                        -impulseY * p2.mass / (p1.mass + p2.mass) * p1.elasticity,
                                        p1.x, p1.y);
                            p2.applyForce(impulseX * p1.mass / (p1.mass + p2.mass) * p2.elasticity,
                                        impulseY * p1.mass / (p1.mass + p2.mass) * p2.elasticity,
                                        p2.x, p2.y);
                        } else {
                            // Apply attraction/repulsion
                            const force = (attraction - repulsion) / (distance * distance);
                            const fx = dx * force;
                            const fy = dy * force;

                            p1.applyForce(fx, fy);
                            p2.applyForce(-fx, -fy);
                        }
                    }

                    // Update particle
                    p1.update(dt);

                    // Boundary handling
                    switch(boundaryType) {
                        case 'bounce':
                            this.handleBounceBoundary(p1, boundaryElasticity);
                            break;
                        case 'wrap':
                            this.handleWrapBoundary(p1);
                            break;
                        case 'stop':
                            this.handleStopBoundary(p1);
                            break;
                    }
                }

                // Update FPS and stats
                this.frameCount++;
                const now = performance.now();
                if (now - this.lastFpsUpdate >= 1000) {
                    this.fps = this.frameCount;
                    this.frameCount = 0;
                    this.lastFpsUpdate = now;
                    document.getElementById('fps').textContent = this.fps;
                    document.getElementById('particleCount').textContent = this.particles.length;
                    document.getElementById('energy').textContent = 
                        this.particles.reduce((sum, p) => sum + p.getEnergy(), 0).toFixed(2);
                }
            }

            handleBounceBoundary(particle, elasticity) {
                if (particle.x < particle.size) {
                    particle.x = particle.size;
                    particle.vx *= -elasticity;
                } else if (particle.x > this.canvas.width - particle.size) {
                    particle.x = this.canvas.width - particle.size;
                    particle.vx *= -elasticity;
                }

                if (particle.y < particle.size) {
                    particle.y = particle.size;
                    particle.vy *= -elasticity;
                } else if (particle.y > this.canvas.height - particle.size) {
                    particle.y = this.canvas.height - particle.size;
                    particle.vy *= -elasticity;
                }
            }

            handleWrapBoundary(particle) {
                if (particle.x < -particle.size) particle.x = this.canvas.width + particle.size;
                if (particle.x > this.canvas.width + particle.size) particle.x = -particle.size;
                if (particle.y < -particle.size) particle.y = this.canvas.height + particle.size;
                if (particle.y > this.canvas.height + particle.size) particle.y = -particle.size;
            }

            handleStopBoundary(particle) {
                if (particle.x < particle.size) {
                    particle.x = particle.size;
                    particle.vx = 0;
                } else if (particle.x > this.canvas.width - particle.size) {
                    particle.x = this.canvas.width - particle.size;
                    particle.vx = 0;
                }

                if (particle.y < particle.size) {
                    particle.y = particle.size;
                    particle.vy = 0;
                } else if (particle.y > this.canvas.height - particle.size) {
                    particle.y = this.canvas.height - particle.size;
                    particle.vy = 0;
                }
            }

            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.particles.forEach(particle => particle.draw(this.ctx));
            }

            animate(currentTime) {
                const dt = Math.min((currentTime - this.lastTime) / 1000, 0.1); // Cap dt at 0.1
                this.lastTime = currentTime;

                this.update(dt);
                this.draw();

                requestAnimationFrame((time) => this.animate(time));
            }

            clear() {
                this.particles = [];
            }

            save() {
                const data = this.particles.map(p => ({
                    x: p.x,
                    y: p.y,
                    size: p.size,
                    mass: p.mass,
                    elasticity: p.elasticity,
                    friction: p.friction,
                    color: p.color,
                    shape: p.shape
                }));
                localStorage.setItem('particlePhysics', JSON.stringify(data));
                alert('Simulation saved!');
            }

            load() {
                const data = localStorage.getItem('particlePhysics');
                if (data) {
                    this.particles = JSON.parse(data).map(p => new Particle(
                        p.x, p.y, p.size, p.mass, p.elasticity, p.friction, p.color, p.shape
                    ));
                    alert('Simulation loaded!');
                } else {
                    alert('No saved simulation found!');
                }
            }

            togglePause() {
                this.paused = !this.paused;
                document.getElementById('pauseBtn').textContent = this.paused ? 'Resume' : 'Pause';
            }

            loadPreset(preset) {
                this.clear();
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;

                switch(preset) {
                    case 'solar':
                        // Create sun
                        this.particles.push(new Particle(centerX, centerY, 20, 1000, 0.8, 0.01, '#ffd700', 'circle'));
                        
                        // Create planets
                        for (let i = 0; i < 5; i++) {
                            const angle = (i / 5) * Math.PI * 2;
                            const distance = 100 + i * 50;
                            const x = centerX + Math.cos(angle) * distance;
                            const y = centerY + Math.sin(angle) * distance;
                            const size = 5 + i * 2;
                            const mass = 10 + i * 5;
                            const vx = Math.cos(angle + Math.PI/2) * 2;
                            const vy = Math.sin(angle + Math.PI/2) * 2;
                            const planet = new Particle(x, y, size, mass, 0.8, 0.01, `hsl(${i * 72}, 70%, 50%)`, 'circle');
                            planet.vx = vx;
                            planet.vy = vy;
                            this.particles.push(planet);
                        }
                        break;

                    case 'explosion':
                        for (let i = 0; i < 50; i++) {
                            const angle = (i / 50) * Math.PI * 2;
                            const speed = 5 + Math.random() * 5;
                            const particle = new Particle(
                                centerX, centerY, 3, 1, 0.8, 0.01,
                                `hsl(${Math.random() * 360}, 70%, 50%)`, 'circle'
                            );
                            particle.vx = Math.cos(angle) * speed;
                            particle.vy = Math.sin(angle) * speed;
                            this.particles.push(particle);
                        }
                        break;

                    case 'fountain':
                        for (let i = 0; i < 30; i++) {
                            const x = centerX + (Math.random() - 0.5) * 20;
                            const y = centerY;
                            const vx = (Math.random() - 0.5) * 2;
                            const vy = -10 - Math.random() * 5;
                            const particle = new Particle(x, y, 3, 1, 0.8, 0.01, '#00ffff', 'circle');
                            particle.vx = vx;
                            particle.vy = vy;
                            this.particles.push(particle);
                        }
                        break;

                    case 'vortex':
                        for (let i = 0; i < 100; i++) {
                            const angle = (i / 100) * Math.PI * 2;
                            const distance = Math.random() * 200;
                            const x = centerX + Math.cos(angle) * distance;
                            const y = centerY + Math.sin(angle) * distance;
                            const particle = new Particle(x, y, 2, 1, 0.8, 0.01, '#ff00ff', 'circle');
                            const speed = 2 + distance * 0.02;
                            particle.vx = Math.cos(angle + Math.PI/2) * speed;
                            particle.vy = Math.sin(angle + Math.PI/2) * speed;
                            this.particles.push(particle);
                        }
                        break;

                    case 'gas':
                        for (let i = 0; i < 100; i++) {
                            const x = centerX + (Math.random() - 0.5) * 200;
                            const y = centerY + (Math.random() - 0.5) * 200;
                            const particle = new Particle(x, y, 2, 1, 0.8, 0.01, '#00ff00', 'circle');
                            particle.vx = (Math.random() - 0.5) * 2;
                            particle.vy = (Math.random() - 0.5) * 2;
                            this.particles.push(particle);
                        }
                        break;

                    case 'pendulum':
                        // Create fixed point
                        const fixedPoint = new Particle(centerX, centerY - 200, 5, 1000, 0.8, 0.01, '#ffffff', 'circle');
                        this.particles.push(fixedPoint);

                        // Create pendulum
                        const pendulum = new Particle(centerX, centerY, 10, 10, 0.8, 0.01, '#ff0000', 'circle');
                        pendulum.vx = 5;
                        this.particles.push(pendulum);
                        break;
                }
            }
        }

        class SpatialHashGrid {
            constructor(cellSize) {
                this.cellSize = cellSize;
                this.grid = new Map();
            }

            getCellKey(x, y) {
                const cellX = Math.floor(x / this.cellSize);
                const cellY = Math.floor(y / this.cellSize);
                return `${cellX},${cellY}`;
            }

            insert(particle) {
                const key = this.getCellKey(particle.x, particle.y);
                if (!this.grid.has(key)) {
                    this.grid.set(key, new Set());
                }
                this.grid.get(key).add(particle);
            }

            query(particle) {
                const key = this.getCellKey(particle.x, particle.y);
                const nearby = new Set();
                
                // Check current cell and 8 surrounding cells
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dy = -1; dy <= 1; dy++) {
                        const cellX = Math.floor(particle.x / this.cellSize) + dx;
                        const cellY = Math.floor(particle.y / this.cellSize) + dy;
                        const cellKey = `${cellX},${cellY}`;
                        
                        if (this.grid.has(cellKey)) {
                            this.grid.get(cellKey).forEach(p => nearby.add(p));
                        }
                    }
                }
                
                return nearby;
            }

            clear() {
                this.grid.clear();
            }
        }

        // Initialize the physics simulation
        const canvas = document.getElementById('physicsCanvas');
        const simulation = new PhysicsSimulation(canvas);
    </script>
