<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Particle System - Th3-C0der Playground</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5166575587547718"
        crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .controls {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            color: white;
            text-align: center;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            min-width: 300px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .controls button,
        .controls select {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 15px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            width: 100%;
            text-align: center;
            font-weight: 500;
        }

        .controls button:hover,
        .controls select:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .controls button:active,
        .controls select:active {
            transform: translateY(1px);
        }

        .controls input[type="range"] {
            width: 100%;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .instructions {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            font-size: 14px;
            max-width: 250px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .instructions h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .instructions p {
            margin: 5px 0;
            line-height: 1.4;
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: 1fr;
                width: 90%;
            }

            .instructions {
                display: none;
            }
        }

        .ad-overlay-bottom {
            position: fixed;
            bottom: 0px;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            padding: 10px 0;
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>
    <canvas id="particleCanvas"></canvas>
    <a href="/playground" class="back-btn">← Back to Playground</a>
    <div class="instructions">
        <h3>Controls:</h3>
        <p>• Click/Drag: Create particles</p>
        <p>• Space: Toggle gravity</p>
        <p>• R: Reset particles</p>
        <p>• C: Change color mode</p>
    </div>
    <div class="controls">
        <div class="control-group">
            <select id="particleType">
                <option value="circle">Circle</option>
                <option value="square">Square</option>
                <option value="triangle">Triangle</option>
                <option value="star">Star</option>
            </select>
            <select id="colorMode">
                <option value="solid">Solid Color</option>
                <option value="rainbow">Rainbow</option>
                <option value="gradient">Gradient</option>
                <option value="fire">Fire</option>
            </select>
        </div>
        <div class="control-group">
            <label>Gravity: <span id="gravityValue">0.1</span></label>
            <input type="range" id="gravity" min="0" max="0.5" step="0.01" value="0.1">
            <label>Particle Size: <span id="sizeValue">5</span></label>
            <input type="range" id="size" min="1" max="20" step="1" value="5">
        </div>
        <div class="control-group">
            <button onclick="toggleGravity()">Toggle Gravity</button>
            <button onclick="resetParticles()">Reset</button>
            <button onclick="toggleTrail()">Toggle Trail</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouse = { x: null, y: null };
        let gravity = 0.1;
        let showTrail = false;
        let particleType = 'circle';
        let colorMode = 'solid';
        let colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
        let currentColor = colors[0];
        let hue = 0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = parseInt(document.getElementById('size').value);
                this.speedX = Math.random() * 3 - 1.5;
                this.speedY = Math.random() * 3 - 1.5;
                this.color = this.getColor();
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.2;
                this.life = 1;
                this.decay = Math.random() * 0.02 + 0.02;
            }

            getColor() {
                switch (colorMode) {
                    case 'rainbow':
                        return `hsl(${hue}, 100%, 50%)`;
                    case 'gradient':
                        return `hsl(${Math.random() * 360}, 100%, 50%)`;
                    case 'fire':
                        return `hsl(${Math.random() * 30 + 15}, 100%, 50%)`;
                    default:
                        return currentColor;
                }
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.speedY += gravity;
                this.rotation += this.rotationSpeed;
                this.life -= this.decay;

                if (this.size > 0.2) this.size -= 0.1;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;

                switch (particleType) {
                    case 'square':
                        ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                        break;
                    case 'triangle':
                        ctx.beginPath();
                        ctx.moveTo(0, -this.size);
                        ctx.lineTo(this.size, this.size);
                        ctx.lineTo(-this.size, this.size);
                        ctx.closePath();
                        ctx.fill();
                        break;
                    case 'star':
                        this.drawStar(0, 0, this.size, this.size / 2, 5);
                        break;
                    default:
                        ctx.beginPath();
                        ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
                        ctx.fill();
                }
                ctx.restore();
            }

            drawStar(cx, cy, spikes, outerRadius, innerRadius) {
                let rot = Math.PI / 2 * 3;
                let x = cx;
                let y = cy;
                let step = Math.PI / spikes;

                ctx.beginPath();
                ctx.moveTo(cx, cy - outerRadius);
                for (let i = 0; i < spikes; i++) {
                    x = cx + Math.cos(rot) * outerRadius;
                    y = cy + Math.sin(rot) * outerRadius;
                    ctx.lineTo(x, y);
                    rot += step;

                    x = cx + Math.cos(rot) * innerRadius;
                    y = cy + Math.sin(rot) * innerRadius;
                    ctx.lineTo(x, y);
                    rot += step;
                }
                ctx.lineTo(cx, cy - outerRadius);
                ctx.closePath();
                ctx.fill();
            }
        }

        function init() {
            particles = [];
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height
                ));
            }
        }

        function animate() {
            if (!showTrail) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            hue = (hue + 1) % 360;

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                if (particles[i].life <= 0 || particles[i].size <= 0.2) {
                    particles.splice(i, 1);
                    i--;
                }
            }

            if (particles.length < 100) {
                particles.push(new Particle(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height
                ));
            }

            requestAnimationFrame(animate);
        }

        function toggleGravity() {
            gravity = gravity === 0 ? parseFloat(document.getElementById('gravity').value) : 0;
        }

        function toggleTrail() {
            showTrail = !showTrail;
        }

        function resetParticles() {
            init();
        }

        // Event Listeners
        canvas.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
            for (let i = 0; i < 3; i++) {
                particles.push(new Particle(mouse.x, mouse.y));
            }
        });

        canvas.addEventListener('click', (e) => {
            for (let i = 0; i < 20; i++) {
                particles.push(new Particle(e.x, e.y));
            }
        });

        document.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'Space':
                    toggleGravity();
                    break;
                case 'KeyR':
                    resetParticles();
                    break;
                case 'KeyC':
                    const colorModes = ['solid', 'rainbow', 'gradient', 'fire'];
                    const currentIndex = colorModes.indexOf(colorMode);
                    colorMode = colorModes[(currentIndex + 1) % colorModes.length];
                    document.getElementById('colorMode').value = colorMode;
                    break;
            }
        });

        document.getElementById('particleType').addEventListener('change', (e) => {
            particleType = e.target.value;
        });

        document.getElementById('colorMode').addEventListener('change', (e) => {
            colorMode = e.target.value;
        });

        document.getElementById('gravity').addEventListener('input', (e) => {
            gravity = parseFloat(e.target.value);
            document.getElementById('gravityValue').textContent = e.target.value;
        });

        document.getElementById('size').addEventListener('input', (e) => {
            document.getElementById('sizeValue').textContent = e.target.value;
        });

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        init();
        animate();
    </script>

        <div style="width:100%; display:flex; flex-direction:column; align-items:center;">

                data-full-width-responsive="true"></ins>
            <script>
                (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
    </div>
</body>

</html>
