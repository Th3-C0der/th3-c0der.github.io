<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis Tool - Th3-C0der Playground</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5166575587547718"
        crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 1200px;
            width: 90%;
        }

        .input-area {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            margin: 1rem 0;
            padding: 1rem;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            resize: vertical;
            margin-bottom: 1rem;
        }

        textarea:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(78, 205, 196, 0.5);
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        .control-group {
            text-align: left;
        }

        .control-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: rgba(255, 255, 255, 0.8);
        }

        select {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            font-size: 1rem;
        }

        select:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(78, 205, 196, 0.5);
        }

        .result-area {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            min-height: 100px;
        }

        .sentiment-score {
            font-size: 2rem;
            margin: 1rem 0;
            color: #4ecdc4;
        }

        .sentiment-label {
            font-size: 1.2rem;
            margin: 0.5rem 0;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            display: inline-block;
        }

        .positive,
        .joy,
        .gratitude,
        .optimism,
        .admiration {
            background: rgba(46, 213, 115, 0.2);
            color: #2ed573;
        }

        .negative,
        .anger,
        .sadness,
        .fear,
        .disgust,
        .pessimism {
            background: rgba(255, 71, 87, 0.2);
            color: #ff4757;
        }

        .neutral,
        .conflicted,
        .ambiguity {
            background: rgba(255, 171, 0, 0.2);
            color: #ffab00;
        }

        .surprise,
        .trust,
        .anticipation {
            background: rgba(78, 205, 196, 0.2);
            color: #4ecdc4;
        }

        .sarcasm {
            background: rgba(255, 107, 129, 0.2);
            color: #ff6b81;
        }

        .sentiment-details {
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            text-align: left;
        }

        .sentiment-details h3 {
            margin: 0 0 0.5rem 0;
            color: #4ecdc4;
        }

        .sentiment-details p {
            margin: 0.5rem 0;
            color: rgba(255, 255, 255, 0.8);
        }

        .sentiment-meter {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin: 1rem 0;
            overflow: hidden;
        }

        .sentiment-meter-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4757, #ffab00, #2ed573);
            transition: width 0.3s ease;
        }

        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
        }

        button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .back-btn::before {
            content: '←';
            font-size: 1.2rem;
        }

        .loading {
            display: none;
            margin: 1rem 0;
        }

        .loading::after {
            content: '';
            display: inline-block;

            border: 2px solid #4ecdc4;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
                margin-top: 60px;
            }

            .back-btn {
                top: 10px;
                left: 10px;
                padding: 8px 16px;
                font-size: 0.9rem;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .back-btn {
                width: calc(100% - 20px);
                justify-content: center;
                top: 10px;
                left: 10px;
            }

            .container {
                margin-top: 70px;
                width: 95%;
            }
        }

        .ad-overlay-bottom {
            position: fixed;
            bottom: 0px;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            padding: 10px 0;
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>
    <a href="/playground" class="back-btn">Back to Playground</a>
    <div class="container">
        <h1>Sentiment Analysis Tool</h1>
        <div class="input-area">
            <textarea id="text-input" placeholder="Enter your text here to analyze its sentiment..."></textarea>
            <div class="controls">
                <div class="control-group">
                    <label for="model">Model</label>
                    <select id="model">
                        <option value="">Default</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="analysis-type">Analysis Type</label>
                    <select id="analysis-type">
                        <option value="basic">Basic (Positive/Negative/Neutral)</option>
                        <option value="advanced">Advanced (Detailed Emotions)</option>
                    </select>
                </div>
            </div>
            <div class="buttons">
                <button id="analyze">Analyze Sentiment</button>
                <button id="clear">Clear</button>
            </div>
        </div>
        <div class="result-area">
            <div class="loading" id="loading"></div>
            <div id="result"></div>
        </div>
    </div>

    <script>
        class SentimentAnalyzer {
            constructor() {
                this.textInput = document.getElementById('text-input');
                this.model = document.getElementById('model');
                this.analysisType = document.getElementById('analysis-type');
                this.analyzeBtn = document.getElementById('analyze');
                this.clearBtn = document.getElementById('clear');
                this.resultDiv = document.getElementById('result');
                this.loadingDiv = document.getElementById('loading');

                this.sentimentCategories = {
                    positive: ['joy', 'gratitude', 'optimism', 'admiration'],
                    negative: ['anger', 'sadness', 'fear', 'disgust', 'pessimism'],
                    neutral: ['conflicted', 'ambiguity'],
                    special: ['surprise', 'trust', 'anticipation'],
                    complex: ['sarcasm']
                };

                this.setupEventListeners();
                this.loadModels();
            }

            async loadModels() {
                try {
                    const response = await fetch('https://dynaspark.onrender.com/text/models');
                    if (!response.ok) {
                        throw new Error(`Failed to load models: ${response.status} ${response.statusText}`);
                    }
                    const models = await response.json();

                    // Add models to select element
                    models.forEach(model => {
                        const option = document.createElement('option');
                        option.value = model.name;
                        option.textContent = `${model.description} (${model.name})`;
                        this.model.appendChild(option);
                    });
                } catch (error) {
                    console.error('Error loading models:', error);
                    // Add default models as fallback
                    const defaultModels = [
                        { name: 'mistral', description: 'Mistral AI Model' },
                        { name: 'qwen-coder', description: 'Qwen Coder Model' }
                    ];
                    defaultModels.forEach(model => {
                        const option = document.createElement('option');
                        option.value = model.name;
                        option.textContent = `${model.description} (${model.name})`;
                        this.model.appendChild(option);
                    });
                }
            }

            setupEventListeners() {
                this.analyzeBtn.addEventListener('click', () => this.analyzeSentiment());
                this.clearBtn.addEventListener('click', () => this.clearAll());
            }

            async analyzeSentiment() {
                const text = this.textInput.value.trim();
                if (!text) {
                    alert('Please enter some text to analyze.');
                    return;
                }

                this.showLoading();
                this.resultDiv.innerHTML = '';
                const isAdvanced = this.analysisType.value === 'advanced';

                try {
                    const prompt = isAdvanced
                        ? `Analyze the sentiment of this text and respond with ONLY a JSON object in this exact format, no other text:
{
  "score": 0.8,
  "primary_emotion": "joy",
  "secondary_emotions": ["gratitude", "optimism"],
  "confidence": 0.9
}

Valid primary_emotion values: joy, gratitude, optimism, admiration, anger, sadness, fear, disgust, pessimism, conflicted, ambiguity, surprise, trust, anticipation, sarcasm

Text: "${text}"`
                        : `Analyze the sentiment of this text and respond with ONLY a JSON object in this exact format, no other text:
{
  "score": 0.8,
  "label": "positive"
}

Valid label values: positive, negative, neutral

Text: "${text}"`;

                    const modelParam = this.model.value ? `&model=${this.model.value}` : '';
                    const response = await fetch(`https://dynaspark.onrender.com/api/generate_response?user_input=${encodeURIComponent(prompt)}${modelParam}&json=true`);

                    if (!response.ok) {
                        if (response.status === 429) {
                            throw new Error('Rate limit exceeded. Please try again in a minute.');
                        }
                        throw new Error(`API Error: ${response.status} ${response.statusText}`);
                    }

                    const data = await response.json();

                    // Handle API response according to documentation
                    if (data && typeof data === 'object') {
                        if (data.message) {
                            try {
                                // Try to parse the message as JSON
                                const parsedData = JSON.parse(data.message);
                                this.displayResult(parsedData, isAdvanced);
                                return;
                            } catch (e) {
                                // If parsing fails, check if the message itself is a valid sentiment object
                                if (data.message.score !== undefined) {
                                    this.displayResult(data.message, isAdvanced);
                                    return;
                                }
                                throw new Error('Invalid response format');
                            }
                        } else if (data.score !== undefined) {
                            // Direct sentiment object
                            this.displayResult(data, isAdvanced);
                            return;
                        }
                    }

                    throw new Error('Invalid response format from API');
                } catch (error) {
                    console.error('Analysis error:', error);
                    // Fallback to local analysis
                    const analysis = this.analyzeText(text);
                    const sentiment = isAdvanced ? this.getAdvancedSentiment(analysis) : this.getBasicSentiment(analysis);
                    this.displayResult(sentiment, isAdvanced);
                } finally {
                    this.hideLoading();
                }
            }

            displayResult(data, isAdvanced) {
                let sentiment;
                try {
                    // If data is a string, try to parse it as JSON
                    if (typeof data === 'string') {
                        sentiment = JSON.parse(data);
                    } else {
                        sentiment = data;
                    }

                    // Ensure we have the required fields
                    if (isAdvanced) {
                        sentiment = {
                            score: sentiment.score || 0,
                            primary_emotion: sentiment.primary_emotion || 'neutral',
                            secondary_emotions: sentiment.secondary_emotions || [],
                            tertiary_emotions: sentiment.tertiary_emotions || [],
                            emotional_intensity: sentiment.emotional_intensity || 0.5,
                            emotional_complexity: sentiment.emotional_complexity || 0.5,
                            emotional_context: sentiment.emotional_context || {},
                            confidence: sentiment.confidence || 0.8
                        };
                    } else {
                        sentiment = {
                            score: sentiment.score || 0,
                            label: sentiment.label || this.getSentimentLabel(sentiment.score || 0)
                        };
                    }
                } catch (error) {
                    console.error('Display error:', error);
                    // Fallback to local analysis
                    const analysis = this.analyzeText(this.textInput.value);
                    sentiment = isAdvanced ? this.getAdvancedSentiment(analysis) : this.getBasicSentiment(analysis);
                }

                const score = sentiment.score || 0;
                const label = sentiment.label || this.getSentimentLabel(score);
                const confidence = sentiment.confidence || 0.8;
                const secondaryEmotions = sentiment.secondary_emotions || [];
                const tertiaryEmotions = sentiment.tertiary_emotions || [];
                const emotionalIntensity = sentiment.emotional_intensity || 0.5;
                const emotionalComplexity = sentiment.emotional_complexity || 0.5;
                const emotionalContext = sentiment.emotional_context || {};

                let html = `
                    <div class="sentiment-meter">
                        <div class="sentiment-meter-fill" style="width: ${((score + 1) / 2 * 100)}%"></div>
                    </div>
                    <div class="sentiment-score">${score.toFixed(2)}</div>
                    <div class="sentiment-label ${label.toLowerCase()}">${label}</div>
                `;

                if (isAdvanced) {
                    html += `
                        <div class="sentiment-details">
                            <h3>Detailed Analysis</h3>
                            <p><strong>Primary Emotion:</strong> ${sentiment.primary_emotion || label}</p>
                            ${secondaryEmotions.length > 0 ? `<p><strong>Secondary Emotions:</strong> ${secondaryEmotions.join(', ')}</p>` : ''}
                            ${tertiaryEmotions.length > 0 ? `<p><strong>Tertiary Emotions:</strong> ${tertiaryEmotions.join(', ')}</p>` : ''}
                            <p><strong>Emotional Intensity:</strong> ${(emotionalIntensity * 100).toFixed(1)}%</p>
                            <p><strong>Emotional Complexity:</strong> ${(emotionalComplexity * 100).toFixed(1)}%</p>
                            <p><strong>Emotional Context:</strong></p>
                            <ul>
                                <li>Mixed Emotions: ${emotionalContext.is_mixed ? 'Yes' : 'No'}</li>
                                <li>Dominant Tone: ${emotionalContext.dominant_tone?.replace(/_/g, ' ')}</li>
                                <li>Emotional Balance: ${emotionalContext.emotional_balance?.replace(/_/g, ' ')}</li>
                                <li>Emotional Stability: ${emotionalContext.emotional_stability?.replace(/_/g, ' ')}</li>
                            </ul>
                            <p><strong>Confidence:</strong> ${(confidence * 100).toFixed(1)}%</p>
                        </div>
                    `;
                }

                this.resultDiv.innerHTML = html;
            }

            analyzeText(text) {
                const words = text.toLowerCase().split(/\s+/);
                const analysis = {
                    positive: 0,
                    negative: 0,
                    neutral: 0,
                    emotions: {}
                };

                // Check for sarcasm patterns first
                const sarcasmPatterns = [
                    /so good it.*trash/i,
                    /so good it.*bad/i,
                    /so good it.*terrible/i,
                    /so good it.*awful/i,
                    /so good it.*horrible/i,
                    /so good it.*waste/i,
                    /so good it.*garbage/i,
                    /so good it.*rubbish/i,
                    /so good it.*useless/i,
                    /so good it.*worthless/i
                ];

                const hasSarcasm = sarcasmPatterns.some(pattern => pattern.test(text));
                if (hasSarcasm) {
                    analysis.emotions.sarcasm = 3; // Increased weight for sarcasm
                    analysis.emotions.disgust = 2;
                    analysis.emotions.anger = 1;
                    return analysis;
                }

                // Emotion word lists with weights
                const emotionWords = {
                    joy: ['happy', 'joy', 'delighted', 'excited', 'thrilled', 'perfect', 'perfection', 'great', 'wonderful'],
                    gratitude: ['thank', 'appreciate', 'grateful', 'thanks'],
                    optimism: ['hope', 'optimistic', 'positive', 'better', 'improve', 'good'],
                    admiration: ['amazing', 'excellent', 'outstanding', 'great', 'wonderful', 'impressive'],
                    anger: ['angry', 'furious', 'annoyed', 'irritated', 'mad', 'broke', 'broken', 'terrible', 'awful'],
                    sadness: ['sad', 'upset', 'disappointed', 'unhappy', 'depressed', 'not good'],
                    fear: ['afraid', 'scared', 'worried', 'anxious', 'fearful', 'concerned'],
                    disgust: ['disgusting', 'gross', 'awful', 'terrible', 'horrible', 'not completely terrible', 'trash', 'garbage', 'rubbish', 'waste'],
                    pessimism: ['bad', 'poor', 'worst', 'terrible', 'awful', 'not good'],
                    surprise: ['surprised', 'shocked', 'amazed', 'wow', 'unexpected'],
                    trust: ['trust', 'reliable', 'dependable', 'confident'],
                    anticipation: ['excited', 'looking forward', 'can\'t wait', 'eager'],
                    sarcasm: ['chef\'s kiss', 'perfect', 'just what i needed', 'exactly what i wanted', 'not completely terrible']
                };

                // Check for negation
                const negations = ['not', 'no', 'never', 'neither', 'nor', 'basically'];
                let isNegated = false;

                words.forEach((word, index) => {
                    // Check for negations
                    if (negations.includes(word)) {
                        isNegated = true;
                        return;
                    }

                    // Check for emotions
                    Object.entries(emotionWords).forEach(([emotion, words]) => {
                        if (words.includes(word)) {
                            // If the word is negated, invert the emotion
                            if (isNegated) {
                                const oppositeEmotion = this.getOppositeEmotion(emotion);
                                analysis.emotions[oppositeEmotion] = (analysis.emotions[oppositeEmotion] || 0) + 2; // Increased weight for negated emotions
                            } else {
                                analysis.emotions[emotion] = (analysis.emotions[emotion] || 0) + 1;
                            }
                        }
                    });

                    // Basic sentiment
                    if (['good', 'great', 'excellent', 'happy', 'love', 'perfect'].includes(word)) {
                        analysis.positive += isNegated ? -2 : 1; // Increased negative weight for negated positive words
                    } else if (['bad', 'terrible', 'awful', 'sad', 'hate', 'broke', 'broken', 'trash', 'garbage', 'rubbish', 'waste'].includes(word)) {
                        analysis.negative += isNegated ? -1 : 2; // Increased weight for negative words
                    } else {
                        analysis.neutral += 1;
                    }

                    // Reset negation after processing the word
                    isNegated = false;
                });

                return analysis;
            }

            getOppositeEmotion(emotion) {
                const opposites = {
                    joy: 'sadness',
                    gratitude: 'disgust',
                    optimism: 'pessimism',
                    admiration: 'disgust',
                    anger: 'joy',
                    sadness: 'joy',
                    fear: 'trust',
                    disgust: 'admiration',
                    pessimism: 'optimism',
                    surprise: 'neutral',
                    trust: 'fear',
                    anticipation: 'neutral',
                    neutral: 'neutral'
                };
                return opposites[emotion] || 'neutral';
            }

            getBasicSentiment(analysis) {
                // If sarcasm is detected, return negative sentiment
                if (analysis.emotions.sarcasm) {
                    return {
                        score: -0.8,
                        label: 'Negative'
                    };
                }

                const total = analysis.positive + analysis.negative + analysis.neutral;
                // Increase weight of negative words
                const score = (analysis.positive - (analysis.negative * 1.5)) / total;
                return {
                    score: Math.max(-1, Math.min(1, score)),
                    label: this.getSentimentLabel(score)
                };
            }

            getAdvancedSentiment(analysis) {
                const emotions = analysis.emotions;

                // Check for sarcasm first
                if (emotions.sarcasm) {
                    return {
                        score: -0.9, // More negative score for sarcasm
                        primary_emotion: 'sarcasm',
                        secondary_emotions: ['disgust', 'anger', 'pessimism'],
                        tertiary_emotions: ['disappointment', 'frustration'],
                        emotional_intensity: 0.95,
                        emotional_complexity: 0.9,
                        confidence: 0.95
                    };
                }

                // Get primary, secondary, and tertiary emotions
                const sortedEmotions = Object.entries(emotions)
                    .sort(([, a], [, b]) => b - a);

                const primaryEmotion = sortedEmotions[0]?.[0] || 'neutral';
                const secondaryEmotions = sortedEmotions
                    .slice(1, 3)
                    .map(([emotion]) => emotion);
                const tertiaryEmotions = sortedEmotions
                    .slice(3, 5)
                    .map(([emotion]) => emotion);

                // Calculate base score
                let score = this.calculateEmotionScore(primaryEmotion, emotions);

                // Calculate emotional intensity
                const emotionalIntensity = this.calculateEmotionalIntensity(emotions);

                // Calculate emotional complexity
                const emotionalComplexity = this.calculateEmotionalComplexity(emotions);

                // Adjust score based on secondary and tertiary emotions
                const emotionWeights = {
                    primary: 0.5,
                    secondary: 0.3,
                    tertiary: 0.2
                };

                let weightedScore = score * emotionWeights.primary;

                secondaryEmotions.forEach(emotion => {
                    const emotionScore = this.calculateEmotionScore(emotion, emotions);
                    weightedScore += emotionScore * emotionWeights.secondary;
                });

                tertiaryEmotions.forEach(emotion => {
                    const emotionScore = this.calculateEmotionScore(emotion, emotions);
                    weightedScore += emotionScore * emotionWeights.tertiary;
                });

                // Apply emotional intensity modifier
                weightedScore *= (1 + emotionalIntensity * 0.2);

                // If negative emotions are present, ensure score reflects negativity
                if (['anger', 'sadness', 'fear', 'disgust', 'pessimism'].includes(primaryEmotion)) {
                    weightedScore = Math.min(weightedScore, -0.5); // More negative minimum score
                }

                // Check for mixed sentiments
                const hasMixedSentiment = this.hasMixedSentiment(emotions);
                if (hasMixedSentiment) {
                    weightedScore = weightedScore * 0.6; // More reduction for mixed sentiments
                }

                // Add emotional context
                const emotionalContext = this.getEmotionalContext(emotions);

                return {
                    score: weightedScore,
                    primary_emotion: primaryEmotion,
                    secondary_emotions: secondaryEmotions,
                    tertiary_emotions: tertiaryEmotions,
                    emotional_intensity: emotionalIntensity,
                    emotional_complexity: emotionalComplexity,
                    emotional_context: emotionalContext,
                    confidence: this.calculateConfidence(emotions)
                };
            }

            calculateEmotionalIntensity(emotions) {
                const totalEmotions = Object.values(emotions).reduce((a, b) => a + b, 0);
                const uniqueEmotions = Object.keys(emotions).length;

                // Base intensity on number of emotions and their frequency
                let intensity = Math.min(1, totalEmotions / 8);

                // Increase intensity for strong emotions
                const strongEmotions = ['anger', 'joy', 'disgust', 'fear'];
                const hasStrongEmotion = strongEmotions.some(emotion => emotions[emotion]);
                if (hasStrongEmotion) {
                    intensity = Math.max(intensity, 0.7);
                }

                // Adjust for emotional diversity
                intensity *= (1 + (uniqueEmotions / 10));

                return Math.min(1, intensity);
            }

            calculateEmotionalComplexity(emotions) {
                const uniqueEmotions = Object.keys(emotions).length;
                const totalEmotions = Object.values(emotions).reduce((a, b) => a + b, 0);

                // Base complexity on number of unique emotions
                let complexity = Math.min(1, uniqueEmotions / 5);

                // Increase complexity for mixed emotions
                const hasMixedEmotions = this.hasMixedSentiment(emotions);
                if (hasMixedEmotions) {
                    complexity = Math.max(complexity, 0.6);
                }

                // Adjust for emotional balance
                const positiveEmotions = ['joy', 'gratitude', 'optimism', 'admiration'];
                const negativeEmotions = ['anger', 'sadness', 'fear', 'disgust', 'pessimism'];

                const positiveCount = positiveEmotions.filter(e => emotions[e]).length;
                const negativeCount = negativeEmotions.filter(e => emotions[e]).length;

                if (positiveCount > 0 && negativeCount > 0) {
                    complexity = Math.max(complexity, 0.8);
                }

                return Math.min(1, complexity);
            }

            getEmotionalContext(emotions) {
                const context = {
                    is_mixed: this.hasMixedSentiment(emotions),
                    dominant_tone: this.getDominantTone(emotions),
                    emotional_balance: this.getEmotionalBalance(emotions),
                    emotional_stability: this.getEmotionalStability(emotions)
                };

                return context;
            }

            getDominantTone(emotions) {
                const positiveEmotions = ['joy', 'gratitude', 'optimism', 'admiration'];
                const negativeEmotions = ['anger', 'sadness', 'fear', 'disgust', 'pessimism'];

                const positiveScore = positiveEmotions.reduce((sum, emotion) =>
                    sum + (emotions[emotion] || 0), 0);
                const negativeScore = negativeEmotions.reduce((sum, emotion) =>
                    sum + (emotions[emotion] || 0), 0);

                if (positiveScore > negativeScore * 1.5) return 'overwhelmingly_positive';
                if (positiveScore > negativeScore) return 'positive';
                if (negativeScore > positiveScore * 1.5) return 'overwhelmingly_negative';
                if (negativeScore > positiveScore) return 'negative';
                return 'balanced';
            }

            getEmotionalBalance(emotions) {
                const positiveEmotions = ['joy', 'gratitude', 'optimism', 'admiration'];
                const negativeEmotions = ['anger', 'sadness', 'fear', 'disgust', 'pessimism'];

                const positiveCount = positiveEmotions.filter(e => emotions[e]).length;
                const negativeCount = negativeEmotions.filter(e => emotions[e]).length;

                if (positiveCount === 0 && negativeCount === 0) return 'neutral';
                if (positiveCount > negativeCount * 2) return 'strongly_positive';
                if (positiveCount > negativeCount) return 'slightly_positive';
                if (negativeCount > positiveCount * 2) return 'strongly_negative';
                if (negativeCount > positiveCount) return 'slightly_negative';
                return 'balanced';
            }

            getEmotionalStability(emotions) {
                const volatileEmotions = ['anger', 'fear', 'surprise'];
                const stableEmotions = ['trust', 'anticipation', 'gratitude'];

                const volatileCount = volatileEmotions.filter(e => emotions[e]).length;
                const stableCount = stableEmotions.filter(e => emotions[e]).length;

                if (volatileCount > stableCount * 2) return 'highly_volatile';
                if (volatileCount > stableCount) return 'volatile';
                if (stableCount > volatileCount * 2) return 'highly_stable';
                if (stableCount > volatileCount) return 'stable';
                return 'neutral';
            }

            hasMixedSentiment(emotions) {
                const positiveEmotions = ['joy', 'gratitude', 'optimism', 'admiration', 'trust', 'anticipation'];
                const negativeEmotions = ['anger', 'sadness', 'fear', 'disgust', 'pessimism'];

                const hasPositive = positiveEmotions.some(emotion => emotions[emotion]);
                const hasNegative = negativeEmotions.some(emotion => emotions[emotion]);

                return hasPositive && hasNegative;
            }

            calculateEmotionScore(primaryEmotion, emotions) {
                const emotionScores = {
                    joy: 0.8,
                    gratitude: 0.7,
                    optimism: 0.6,
                    admiration: 0.9,
                    anger: -0.9,
                    sadness: -0.8,
                    fear: -0.7,
                    disgust: -0.95,
                    pessimism: -0.9,
                    surprise: -0.3,
                    trust: 0.5,
                    anticipation: 0.4,
                    neutral: 0,
                    sarcasm: -0.95
                };

                // Get base score
                let score = emotionScores[primaryEmotion] || 0;

                // Adjust score based on context
                if (emotions.sarcasm) {
                    score = -Math.abs(score); // Make any emotion negative in sarcastic context
                }

                // Check for negative context words
                const negativeContext = ['broke', 'broken', 'terrible', 'awful', 'horrible', 'trash', 'garbage', 'rubbish', 'waste'];
                const hasNegativeContext = negativeContext.some(word =>
                    this.textInput.value.toLowerCase().includes(word)
                );

                if (hasNegativeContext) {
                    score = Math.min(score, -0.5); // More negative minimum score
                }

                return score;
            }

            calculateConfidence(emotions) {
                const totalEmotions = Object.values(emotions).reduce((a, b) => a + b, 0);
                let confidence = Math.min(1, totalEmotions / 10);

                // Increase confidence for sarcasm
                if (emotions.sarcasm) {
                    confidence = Math.max(confidence, 0.9);
                }

                // Increase confidence for strong negative emotions
                const strongEmotions = ['anger', 'disgust', 'pessimism'];
                if (strongEmotions.some(emotion => emotions[emotion])) {
                    confidence = Math.max(confidence, 0.8);
                }

                return confidence;
            }

            getSentimentLabel(score) {
                if (score > 0.2) return 'Positive';
                if (score < -0.2) return 'Negative';
                return 'Neutral';
            }

            showLoading() {
                this.loadingDiv.style.display = 'block';
                this.analyzeBtn.disabled = true;
            }

            hideLoading() {
                this.loadingDiv.style.display = 'none';
                this.analyzeBtn.disabled = false;
            }

            clearAll() {
                this.textInput.value = '';
                this.resultDiv.innerHTML = '';
            }
        }

        // Initialize the sentiment analyzer
        const analyzer = new SentimentAnalyzer();
